<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCG Onboarding Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Token reconciliation notes (so this is traceable if you ever formalise a
    shared stylesheet across tools):
    - purple / dark / dark2 / offwhite: identical across all three existing
      tools (Coaching Report Generator, Finance Agreement Builder).
    - muted / border: taken from Coaching Report (#6B7280 / #E5E7EB) rather
      than Finance Builder's (#7a7581 / #e7e2e6). They differ slightly between
      your two tools, this just picks one rather than inventing a third.
    - red / amber / green status colours: taken from Coaching Report, which
      is the only one of the two with a full status system already built out.
    - Body font: Aptos with system fallbacks, taken from Finance Builder.
      This is a better fix than a Google Fonts substitute, Aptos ships with
      Microsoft 365, so anyone on a work machine with Office renders the
      real typeface, not a lookalike. Headings stay on Jost, used for
      headings/buttons/labels in both reference tools.
    - Buttons: small border-radius + uppercase + letter-spacing, matching
      Coaching Report rather than the pill-shaped buttons in my first pass.
  */
  :root {
    --purple: #AC4B82;
    --purple-l: #D19BB9;
    --purple-xl: #F5EBF1;
    --dark: #202331;
    --dark2: #2B2E3E;
    --offwhite: #F4F4F4;
    --white: #FFFFFF;
    --muted: #6B7280;
    --border: #E5E7EB;
    --green: #16A34A;
    --green-l: #DCFCE7;
    --amber: #D97706;
    --amber-l: #FEF3C7;
    --red: #DC2626;
    --red-l: #FEE2E2;
    --shadow: 0 2px 12px rgba(32,35,49,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Aptos', 'Segoe UI', 'Calibri', Arial, sans-serif;
    background: var(--offwhite);
    color: var(--dark);
    font-size: 14px;
    line-height: 1.6;
  }
  h1, h2, h3, .jost { font-family: 'Jost', sans-serif; }

  /* ── HEADER ── */
  header {
    background: var(--dark);
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-mark { width: 34px; height: 34px; flex-shrink: 0; }
  .logo-text {
    font-family: 'Jost', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
  }
  .logo-text span {
    display: block;
    font-weight: 300;
    font-size: 11px;
    color: var(--purple-l);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ── HERO ── */
  .hero {
    background: var(--purple);
    padding: 26px 32px 22px;
    color: var(--white);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 14px;
  }
  .hero h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
  .hero p { font-size: 13px; color: rgba(255,255,255,0.8); font-weight: 300; margin: 0; }

  .mode-toggle {
    display: flex;
    background: rgba(255,255,255,0.15);
    border-radius: 5px;
    padding: 3px;
    gap: 2px;
  }
  .mode-btn {
    background: transparent;
    color: rgba(255,255,255,0.75);
    padding: 8px 16px;
    border-radius: 3px;
  }
  .mode-btn.active { background: var(--white); color: var(--purple); }
  .mode-btn:hover:not(.active) { color: var(--white); }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .top-bar h2 { font-size: 17px; font-weight: 700; margin: 0; color: var(--dark); }

  /* ── BUTTONS ── */
  button {
    font-family: 'Jost', sans-serif;
    cursor: pointer;
    border: none;
    border-radius: 5px;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn-primary { background: var(--purple); color: var(--white); padding: 10px 18px; }
  .btn-primary:hover { background: #9A4374; }
  .btn-ghost {
    background: transparent;
    color: var(--dark);
    padding: 8px 14px;
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--purple); color: var(--purple); }

  /* ── CARDS ── */
  .starter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 18px;
    cursor: pointer;
    transition: transform 0.15s ease;
    position: relative;
  }
  .card:hover { transform: translateY(-1px); }
  .card-delete {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--offwhite);
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
    text-transform: none;
    letter-spacing: normal;
  }
  .card:hover .card-delete { display: flex; }
  .card-delete:hover { background: var(--red-l); color: var(--red); }

  .card.flag-overdue { border-left: 3px solid var(--red); }
  .card.flag-starting_soon { border-left: 3px solid var(--amber); }
  .card-flag-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 3px;
    margin-bottom: 8px;
  }
  .card-flag-badge.overdue { background: var(--red-l); color: var(--red); }
  .card-flag-badge.starting_soon { background: var(--amber-l); color: var(--amber); }

  .refresh-indicator {
    font-size: 11px;
    color: var(--muted);
  }
  .card h3 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  .card .role { color: var(--muted); font-size: 13px; margin-bottom: 14px; }

  .progress-track {
    background: var(--border);
    border-radius: 6px;
    height: 7px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill { background: var(--purple); height: 100%; transition: width 0.3s ease; }
  .progress-fill.complete { background: var(--green); }
  .progress-label {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--purple);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
    margin-bottom: 18px;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }

  .name-bar {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .name-bar a { color: var(--purple); font-weight: 600; cursor: pointer; text-decoration: none; }
  .name-bar a:hover { text-decoration: underline; }

  .detail-header {
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .detail-header h2 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .detail-header .role { color: var(--muted); font-size: 13px; }
  .delete-starter-link {
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    text-decoration: none;
  }
  .delete-starter-link:hover { color: var(--red); text-decoration: underline; }

  /* ── TASK LIST ── */
  .task-list {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .task-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .task-row:last-child { border-bottom: none; }

  .status-select {
    flex-shrink: 0;
    width: 140px;
    padding: 7px 10px;
    border-radius: 4px;
    text-align: center;
    text-align-last: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border: 1px solid transparent;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    font-family: 'Jost', sans-serif;
  }
  .status-select.not_started { background: var(--border); color: var(--muted); }
  .status-select.in_progress { background: var(--amber-l); color: var(--amber); }
  .status-select.done { background: var(--green-l); color: var(--green); }

  .task-info { flex: 1; }
  .task-name { font-size: 14px; font-weight: 500; }
  .task-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .task-timeframe {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    text-align: right;
    width: 90px;
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(32,35,49,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: var(--white);
    border-radius: 8px;
    padding: 26px;
    width: 380px;
    max-width: 90vw;
  }
  .modal h3 { font-size: 17px; font-weight: 700; margin: 0 0 16px; }
  .modal label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 5px;
    margin-top: 14px;
  }
  .modal input {
    width: 100%;
    padding: 9px 11px;
    border: 1.5px solid var(--border);
    border-radius: 5px;
    font-size: 14px;
    font-family: inherit;
    background: var(--offwhite);
    color: var(--dark);
  }
  .modal input:focus { outline: none; border-color: var(--purple); background: var(--white); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }

  /* ── LOGIN ── */
  .login-screen {
    min-height: calc(100vh - 146px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 30px;
    width: 320px;
    text-align: center;
  }
  .login-box h2 { font-size: 17px; font-weight: 700; margin: 0 0 16px; }
  .login-box input {
    width: 100%;
    padding: 9px 11px;
    border: 1.5px solid var(--border);
    border-radius: 5px;
    font-size: 14px;
    font-family: inherit;
    background: var(--offwhite);
    margin-bottom: 12px;
  }
  .login-box input:focus { outline: none; border-color: var(--purple); background: var(--white); }
  .login-error { color: var(--red); font-size: 12px; margin-bottom: 10px; min-height: 14px; }

  /* ── ADMIN ── */
  .admin-table {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .admin-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .admin-row:last-child { border-bottom: none; }
  .admin-row input {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--offwhite);
  }
  .admin-row .f-name { flex: 2; }
  .admin-row .f-resp { flex: 2; }
  .admin-row .f-time { flex: 1; }
  .admin-icon-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 13px;
    padding: 6px;
    text-transform: none;
    letter-spacing: normal;
  }
  .admin-icon-btn:hover { color: var(--red); }
  .admin-icon-btn.save { color: var(--green); }
  .admin-section-title { font-size: 15px; font-weight: 700; margin: 26px 0 10px; }
  .admin-section-title:first-child { margin-top: 0; }
  .password-box {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 18px;
    max-width: 380px;
    margin-bottom: 24px;
  }
  .password-box input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: inherit;
    font-size: 14px;
    background: var(--offwhite);
    margin-bottom: 10px;
  }

  @media print {
    header, .hero, .back-link, .name-bar, .delete-starter-link,
    .btn-primary, .btn-ghost, .top-bar button, select.status-select { display: none !important; }
    body { background: white; }
    main { max-width: 100%; padding: 0; }
    .task-list { box-shadow: none; border: 1px solid #000; }
    .task-row { break-inside: avoid; }
    .status-select { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .print-status-label { display: inline !important; }
  }
  .print-status-label { display: none; font-size: 11px; font-weight: 700; text-transform: uppercase; }
</style>
</head>
<body>

<header>
  <svg class="logo-mark" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="18" cy="18" r="17" stroke="#AC4B82" stroke-width="1.5" fill="none"/>
    <circle cx="18" cy="18" r="12" stroke="#AC4B82" stroke-width="1.5" fill="none"/>
    <circle cx="18" cy="18" r="7" stroke="#AC4B82" stroke-width="1.5" fill="none"/>
    <line x1="23" y1="23" x2="29" y2="29" stroke="#AC4B82" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <div class="logo-text">Quality Care Group<span>Starter &amp; Leaver Tracker</span></div>
</header>

<div class="hero">
  <div>
    <h1 id="hero-title">Onboarding Tracker</h1>
    <p id="hero-sub">Live status for every new starter.</p>
  </div>
  <div class="mode-toggle" id="mode-toggle" style="display:none">
    <button class="mode-btn active" id="mode-btn-onboarding" onclick="switchMode('onboarding')">Onboarding</button>
    <button class="mode-btn" id="mode-btn-offboarding" onclick="switchMode('offboarding')">Offboarding</button>
  </div>
</div>

<main id="app">
  <div class="login-screen">
    <div class="login-box">
      <h2>Enter password</h2>
      <div class="login-error" id="login-error"></div>
      <input id="login-password" type="password" placeholder="Password" onkeydown="if(event.key==='Enter') trySubmitLogin()">
      <button class="btn-primary" style="width:100%" onclick="trySubmitLogin()">Unlock</button>
    </div>
  </div>
</main>

<script>
// Set this to your deployed Apps Script web app URL
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwJ9rqaPzuysRNO-Rs2zCR9Se6UPr4K0jz8WE7au8i0blK7imJHq2uC68dINqENJISR/exec';

let currentView = 'list'; // 'list' | 'detail'
let currentMode = 'onboarding'; // 'onboarding' | 'offboarding'
let currentStarterId = null;
let starters = [];
let tasks = [];

const MODE = {
  onboarding: {
    label: 'starter', labelCap: 'Starter',
    listAction: 'listStarters', tasksAction: 'getStarterTasks',
    addAction: 'addStarter', deleteAction: 'deleteStarter',
    syncAction: 'syncTemplateToAll', statusAction: 'updateTaskStatus',
    idField: 'starterId', dateField: 'startDate', dateLabel: 'Starts',
    heroTitle: 'Onboarding Tracker', heroSub: 'Live status for every new starter.',
    emptyMsg: 'No starters yet. Add one to get going.',
    listHeading: 'New starters', addBtn: '+ Add starter',
    dateInputLabel: 'Start date',
  },
  offboarding: {
    label: 'leaver', labelCap: 'Leaver',
    listAction: 'listLeavers', tasksAction: 'getLeaverTasks',
    addAction: 'addLeaver', deleteAction: 'deleteLeaver',
    syncAction: 'syncOffboardingTemplateToAll', statusAction: 'updateLeaverTaskStatus',
    idField: 'leaverId', dateField: 'lastDay', dateLabel: 'Last day',
    heroTitle: 'Offboarding Tracker', heroSub: 'Live status for every leaver.',
    emptyMsg: 'No leavers yet. Add one to get going.',
    listHeading: 'Leavers', addBtn: '+ Add leaver',
    dateInputLabel: 'Last day',
  },
};

function m() { return MODE[currentMode]; }

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('mode-btn-onboarding').classList.toggle('active', mode === 'onboarding');
  document.getElementById('mode-btn-offboarding').classList.toggle('active', mode === 'offboarding');
  document.getElementById('hero-title').textContent = m().heroTitle;
  document.getElementById('hero-sub').textContent = m().heroSub;
  loadStarters();
}

const app = document.getElementById('app');

function getPassword() {
  return sessionStorage.getItem('qcg_onboard_pw') || '';
}
function getAdminPassword() {
  return sessionStorage.getItem('qcg_admin_pw') || '';
}
const isAdminRoute = new URLSearchParams(window.location.search).get('admin') === '1';

async function adminApi(action, params = {}, body = null) {
  let url = `${SCRIPT_URL}?action=${action}&adminPassword=${encodeURIComponent(getAdminPassword())}`;
  Object.keys(params).forEach(k => url += `&${k}=${encodeURIComponent(params[k])}`);
  const opts = body
    ? { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, adminPassword: getAdminPassword(), ...body }) }
    : { method: 'GET', cache: 'no-store' };
  if (!body) url += `&_ts=${Date.now()}`;
  const res = await fetch(url, opts);
  const data = await res.json();
  if (data && data.error === 'Not authorised') {
    sessionStorage.removeItem('qcg_admin_pw');
    showAdminLogin('Session expired, enter the admin password again.');
    throw new Error('Not authorised');
  }
  return data;
}

async function api(action, params = {}, method = 'GET', body = null) {
  let url = `${SCRIPT_URL}?action=${action}&password=${encodeURIComponent(getPassword())}`;
  Object.keys(params).forEach(k => url += `&${k}=${encodeURIComponent(params[k])}`);

  const opts = { method };
  if (body) {
    opts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
    opts.body = JSON.stringify({ action, password: getPassword(), ...body });
  } else {
    // GET requests: bust browser caching so status changes always show up
    // without needing a manual reload.
    url += `&_ts=${Date.now()}`;
    opts.cache = 'no-store';
  }
  const res = await fetch(url, opts);
  const data = await res.json();
  if (data && data.error === 'Not authorised') {
    sessionStorage.removeItem('qcg_onboard_pw');
    showLogin('Session expired, enter the password again.');
    throw new Error('Not authorised');
  }
  return data;
}

function showLogin(errorMsg) {
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-box">
        <h2>Enter password</h2>
        <div class="login-error">${errorMsg || ''}</div>
        <input id="login-password" type="password" placeholder="Password" onkeydown="if(event.key==='Enter') trySubmitLogin()">
        <button class="btn-primary" style="width:100%" onclick="trySubmitLogin()">Unlock</button>
      </div>
    </div>
  `;
  document.getElementById('login-password').focus();
}

async function trySubmitLogin() {
  const pw = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';

  const url = `${SCRIPT_URL}?action=checkPassword&password=${encodeURIComponent(pw)}`;
  const res = await fetch(url);
  const data = await res.json();

  if (data.valid) {
    sessionStorage.setItem('qcg_onboard_pw', pw);
    document.getElementById('mode-toggle').style.display = 'flex';
    loadStarters();
  } else {
    errorEl.textContent = 'Wrong password, try again.';
  }
}

async function loadStarters() {
  stopAutoRefresh();
  app.innerHTML = '<div class="loading">Loading...</div>';
  try {
    starters = await api(m().listAction);
    renderList();
  } catch (err) {
    app.innerHTML = `<div class="empty">Couldn't load data. Check the script is deployed and SCRIPT_URL is set.</div>`;
    console.error(err);
  }
}

function renderList() {
  currentView = 'list';
  const cfg = m();
  let cardsHtml = '';

  if (starters.length === 0) {
    cardsHtml = `<div class="empty">${cfg.emptyMsg}</div>`;
  } else {
    cardsHtml = `<div class="starter-grid">` + starters.map(s => {
      const id = s[cfg.idField];
      const pct = s.totalTasks > 0 ? Math.round((s.doneTasks / s.totalTasks) * 100) : 0;
      const complete = pct === 100;
      const flagBadge = s.flag === 'overdue' ? '<div class="card-flag-badge overdue">Overdue</div>'
        : s.flag === 'starting_soon' ? `<div class="card-flag-badge starting_soon">${currentMode === 'offboarding' ? 'Leaving soon' : 'Starting soon'}</div>`
        : '';
      return `
        <div class="card flag-${s.flag}" onclick="openStarter('${id}')">
          <button class="card-delete" onclick="event.stopPropagation(); confirmDeleteStarter('${id}', '${escapeAttr(s.name)}')" title="Remove ${cfg.label}">✕</button>
          ${flagBadge}
          <h3>${escapeHtml(s.name)}</h3>
          <div class="role">${escapeHtml(s.role || '')}</div>
          <div class="progress-track">
            <div class="progress-fill ${complete ? 'complete' : ''}" style="width:${pct}%"></div>
          </div>
          <div class="progress-label">
            <span>${s.doneTasks} / ${s.totalTasks} done</span>
            <span>${pct}%</span>
          </div>
        </div>
      `;
    }).join('') + `</div>`;
  }

  app.innerHTML = `
    <div class="top-bar">
      <h2>${cfg.listHeading}</h2>
      <div style="display:flex; gap:8px;">
        <button class="btn-ghost" onclick="syncTemplate()">Sync new tasks</button>
        <button class="btn-primary" onclick="showAddModal()">${cfg.addBtn}</button>
      </div>
    </div>
    ${cardsHtml}
  `;
}

async function syncTemplate() {
  if (!confirm("Push any tasks from the template that " + m().label + "s don't already have onto every checklist? This won't remove or duplicate anything.")) return;
  app.innerHTML = '<div class="loading">Syncing template...</div>';
  const result = await api(m().syncAction, {}, 'POST', {});
  await loadStarters();
  if (result && result.success) {
    const count = result.starterCount ?? result.leaverCount;
    alert(`Done. Added ${result.addedCount} task${result.addedCount === 1 ? '' : 's'} across ${count} ${m().label}${count === 1 ? '' : 's'}.`);
  }
}

async function openStarter(id) {
  currentView = 'detail';
  currentStarterId = id;
  app.innerHTML = '<div class="loading">Loading checklist...</div>';

  const starter = starters.find(s => s[m().idField] === id);
  tasks = await api(m().tasksAction, { [m().idField]: id });
  lastRefreshTime = Date.now();
  renderDetail(starter);
  startAutoRefresh();
}

function renderDetail(starter) {
  const cfg = m();
  const rows = tasks.map(t => `
    <div class="task-row">
      <select class="status-select ${t.status}" onchange="setStatus('${escapeAttr(t.taskName)}', this.value)">
        <option value="not_started" ${t.status === 'not_started' ? 'selected' : ''}>Not started</option>
        <option value="in_progress" ${t.status === 'in_progress' ? 'selected' : ''}>In progress</option>
        <option value="done" ${t.status === 'done' ? 'selected' : ''}>Done</option>
      </select>
      <span class="print-status-label">${STATUS_LABELS[t.status] || t.status}</span>
      <div class="task-info">
        <div class="task-name">${escapeHtml(t.taskName)}</div>
        <div class="task-meta">
          Responsible: ${escapeHtml(t.responsible || '—')}
          ${t.updatedBy ? ` · Last updated by ${escapeHtml(t.updatedBy)}` : ''}
        </div>
      </div>
      ${t.timeFrame ? `<div class="task-timeframe">${escapeHtml(t.timeFrame)}</div>` : ''}
    </div>
  `).join('');

  const id = starter[cfg.idField];
  const dateVal = starter[cfg.dateField];

  app.innerHTML = `
    <a class="back-link" onclick="loadStarters()">&larr; All ${cfg.label}s</a>
    <div class="name-bar">
      <span class="refresh-indicator" id="refresh-indicator"></span>
      Updating as <strong>${escapeHtml(getName())}</strong> · <a onclick="changeName()">not you?</a>
    </div>
    <div class="detail-header">
      <div>
        <h2>${escapeHtml(starter.name)}</h2>
        <div class="role">${escapeHtml(starter.role || '')}${dateVal ? ' · ' + cfg.dateLabel + ' ' + formatDate(dateVal) : ''}</div>
      </div>
      <div style="display:flex; gap:14px; align-items:center;">
        <button class="btn-ghost" onclick="window.print()">Print checklist</button>
        <a class="delete-starter-link" onclick="confirmDeleteStarter('${id}', '${escapeAttr(starter.name)}')">Remove ${cfg.label}</a>
      </div>
    </div>
    <div class="task-list">${rows}</div>
    ${currentMode === 'offboarding' ? `<div class="task-meta" style="margin-top:14px;">Should the responsible person be on annual leave, speak to Carli Chick, or if Carli is the responsible person, speak to Lorrie Maslen. For Breathe HR: Sarah Evans and Carli Chick.</div>` : ''}
  `;
  updateRefreshIndicator();
}

const STATUS_LABELS = { not_started: 'Not started', in_progress: 'In progress', done: 'Done' };
let lastRefreshTime = null;
let refreshTimer = null;
let indicatorTimer = null;

function updateRefreshIndicator() {
  const el = document.getElementById('refresh-indicator');
  if (!el || !lastRefreshTime) return;
  const secs = Math.round((Date.now() - lastRefreshTime) / 1000);
  el.textContent = secs < 5 ? 'Updated just now' : `Updated ${secs}s ago`;
}

function startAutoRefresh() {
  stopAutoRefresh();
  refreshTimer = setInterval(async () => {
    if (currentView !== 'detail' || !currentStarterId) return;
    try {
      const freshTasks = await api(m().tasksAction, { [m().idField]: currentStarterId });
      tasks = freshTasks;
      lastRefreshTime = Date.now();
      const starter = starters.find(s => s[m().idField] === currentStarterId);
      if (starter) renderDetail(starter);
    } catch (err) {
      // silent, next tick will retry
    }
  }, 30000);

  // update the "Xs ago" text every few seconds without refetching
  indicatorTimer = setInterval(updateRefreshIndicator, 5000);
}

function stopAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  if (indicatorTimer) clearInterval(indicatorTimer);
  refreshTimer = null;
  indicatorTimer = null;
}

function getName() {
  let name = sessionStorage.getItem('qcg_onboard_name');
  if (!name) {
    name = prompt('Your name (used for the audit trail, only asked once per session):', '') || 'Unknown';
    sessionStorage.setItem('qcg_onboard_name', name);
  }
  return name;
}

function changeName() {
  const name = prompt('Your name:', sessionStorage.getItem('qcg_onboard_name') || '');
  if (name === null) return;
  sessionStorage.setItem('qcg_onboard_name', name || 'Unknown');
  renderDetail(starters.find(s => s.starterId === currentStarterId));
}

async function setStatus(taskName, nextStatus) {
  const task = tasks.find(t => t.taskName === taskName);
  const currentStatus = task.status;

  if (currentStatus === 'done' && nextStatus === 'not_started') {
    if (!confirm(`Mark "${taskName}" as not started again? This undoes completion.`)) {
      renderDetail(starters.find(s => s[m().idField] === currentStarterId));
      return;
    }
  }

  const updatedBy = getName();

  task.status = nextStatus; // optimistic update
  renderDetail(starters.find(s => s[m().idField] === currentStarterId));

  await api(m().statusAction, {}, 'POST', {
    [m().idField]: currentStarterId,
    taskName,
    status: nextStatus,
    updatedBy,
  });

  // refresh starter summary in background
  starters = await api(m().listAction);
}

async function confirmDeleteStarter(id, name) {
  if (!confirm(`Remove ${name} from the tracker? This deletes their whole checklist and can't be undone.`)) return;
  app.innerHTML = '<div class="loading">Removing...</div>';
  await api(m().deleteAction, {}, 'POST', { [m().idField]: id });
  await loadStarters();
}

function showAddModal() {
  const cfg = m();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Add new ${cfg.label}</h3>
      <label>Name</label>
      <input id="new-name" type="text" placeholder="e.g. John Doe">
      <label>Role</label>
      <input id="new-role" type="text" placeholder="e.g. Account Handler">
      <label>${cfg.dateInputLabel}</label>
      <input id="new-date" type="date">
      <div class="modal-actions">
        <button class="btn-ghost" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
        <button class="btn-primary" onclick="submitAddStarter()">Add ${cfg.label}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('new-name').focus();
}

async function submitAddStarter() {
  const name = document.getElementById('new-name').value.trim();
  const role = document.getElementById('new-role').value.trim();
  const dateVal = document.getElementById('new-date').value;

  if (!name) { alert('Name is required'); return; }

  document.querySelector('.modal-overlay').remove();
  app.innerHTML = '<div class="loading">Adding...</div>';

  const dateParam = currentMode === 'offboarding' ? { lastDay: dateVal } : { startDate: dateVal };
  await api(m().addAction, {}, 'POST', { name, role, ...dateParam });
  await loadStarters();
}

function formatDate(d) {
  try {
    return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch { return d; }
}
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str) {
  return String(str || '').replace(/'/g, "\\'");
}

// ── ADMIN SCREEN ──

function showAdminLogin(errorMsg) {
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-box">
        <h2>Admin access</h2>
        <div class="login-error">${errorMsg || ''}</div>
        <input id="admin-password" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter') tryAdminLogin()">
        <button class="btn-primary" style="width:100%" onclick="tryAdminLogin()">Unlock</button>
      </div>
    </div>
  `;
  document.getElementById('admin-password').focus();
}

async function tryAdminLogin() {
  const pw = document.getElementById('admin-password').value;
  const url = `${SCRIPT_URL}?action=checkAdminPassword&adminPassword=${encodeURIComponent(pw)}`;
  const res = await fetch(url);
  const data = await res.json();
  if (data.valid) {
    sessionStorage.setItem('qcg_admin_pw', pw);
    loadAdmin();
  } else {
    document.querySelector('.login-error').textContent = 'Wrong admin password, try again.';
  }
}

let templates = { onboarding: [], offboarding: [] };

async function loadAdmin() {
  app.innerHTML = '<div class="loading">Loading admin panel...</div>';
  try {
    templates.onboarding = await adminApi('listTemplate', { templateType: 'onboarding' });
    templates.offboarding = await adminApi('listTemplate', { templateType: 'offboarding' });
    renderAdmin();
  } catch (err) {
    console.error(err);
  }
}

function renderAdmin() {
  function tableFor(type) {
    const rows = templates[type].map(t => `
      <div class="admin-row" data-task="${escapeAttr(t.taskName)}" data-type="${type}">
        <input class="f-name" value="${escapeAttr(t.taskName)}">
        <input class="f-resp" value="${escapeAttr(t.responsible || '')}">
        ${type === 'offboarding' ? `<input class="f-time" value="${escapeAttr(t.timeFrame || '')}">` : ''}
        <button class="admin-icon-btn save" onclick="saveTemplateRow(this)" title="Save">✓</button>
        <button class="admin-icon-btn" onclick="deleteTemplateRow('${type}', '${escapeAttr(t.taskName)}')" title="Delete">✕</button>
      </div>
    `).join('');
    return `
      <div class="admin-table">
        ${rows || '<div class="admin-row" style="color:var(--muted)">No tasks yet.</div>'}
        <div class="admin-row" data-type="${type}">
          <input class="f-name new-name" placeholder="New task name">
          <input class="f-resp new-resp" placeholder="Responsible">
          ${type === 'offboarding' ? `<input class="f-time new-time" placeholder="Time frame">` : ''}
          <button class="admin-icon-btn save" onclick="addTemplateRow('${type}', this)" title="Add">+ Add</button>
        </div>
      </div>
    `;
  }

  app.innerHTML = `
    <a class="back-link" onclick="window.location.href = window.location.pathname" style="cursor:pointer">&larr; Back to tracker</a>
    <div class="top-bar"><h2>Admin</h2></div>

    <div class="admin-section-title">Onboarding tasks</div>
    ${tableFor('onboarding')}

    <div class="admin-section-title">Offboarding tasks</div>
    ${tableFor('offboarding')}

    <div class="admin-section-title">Change passwords</div>
    <div style="display:flex; gap:16px; flex-wrap:wrap;">
      <div class="password-box">
        <label style="font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:6px;">Tracker password</label>
        <input id="new-user-pw" type="text" placeholder="New tracker password">
        <button class="btn-primary" style="width:100%" onclick="changeUserPassword()">Update</button>
      </div>
      <div class="password-box">
        <label style="font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:6px;">Admin password</label>
        <input id="new-admin-pw" type="text" placeholder="New admin password">
        <button class="btn-primary" style="width:100%" onclick="changeAdminPasswordUI()">Update</button>
      </div>
    </div>
  `;
}

async function saveTemplateRow(btn) {
  const row = btn.closest('.admin-row');
  const type = row.dataset.type;
  const originalTaskName = row.dataset.task;
  const taskName = row.querySelector('.f-name').value.trim();
  const responsible = row.querySelector('.f-resp').value.trim();
  const timeFrame = row.querySelector('.f-time') ? row.querySelector('.f-time').value.trim() : '';
  if (!taskName) { alert('Task name is required'); return; }
  await adminApi('updateTemplateTask', {}, { templateType: type, originalTaskName, taskName, responsible, timeFrame });
  await loadAdmin();
}

async function addTemplateRow(type, btn) {
  const row = btn.closest('.admin-row');
  const taskName = row.querySelector('.new-name').value.trim();
  const responsible = row.querySelector('.new-resp').value.trim();
  const timeFrame = row.querySelector('.new-time') ? row.querySelector('.new-time').value.trim() : '';
  if (!taskName) { alert('Task name is required'); return; }
  await adminApi('addTemplateTask', {}, { templateType: type, taskName, responsible, timeFrame });
  await loadAdmin();
}

async function deleteTemplateRow(type, taskName) {
  if (!confirm(`Delete "${taskName}" from the ${type} template? This won't remove it from people already in progress, only from the template new starters/leavers get.`)) return;
  await adminApi('deleteTemplateTask', {}, { templateType: type, taskName });
  await loadAdmin();
}

async function changeUserPassword() {
  const pw = document.getElementById('new-user-pw').value.trim();
  if (!pw) { alert('Enter a password first'); return; }
  if (!confirm('Change the tracker password? Everyone currently logged in stays logged in until their session ends, but new logins need the new password.')) return;
  await adminApi('changePassword', {}, { newPassword: pw });
  alert('Tracker password updated.');
  document.getElementById('new-user-pw').value = '';
}

async function changeAdminPasswordUI() {
  const pw = document.getElementById('new-admin-pw').value.trim();
  if (!pw) { alert('Enter a password first'); return; }
  if (!confirm('Change the admin password? You will need it next time you open this admin screen.')) return;
  await adminApi('changeAdminPassword', {}, { newAdminPassword: pw });
  sessionStorage.setItem('qcg_admin_pw', pw);
  alert('Admin password updated.');
  document.getElementById('new-admin-pw').value = '';
}

if (isAdminRoute) {
  document.querySelector('.hero').style.display = 'none';
  if (getAdminPassword()) {
    loadAdmin();
  } else {
    showAdminLogin();
  }
} else if (getPassword()) {
  document.getElementById('mode-toggle').style.display = 'flex';
  loadStarters();
}
</script>
